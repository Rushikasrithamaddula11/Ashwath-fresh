<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Ashwath Fresh Palakova</title>
  <desc id="desc">A bowl of creamy golden Palakova sweet</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="sweet" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.65" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#d88924"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" rx="42" fill="url(#bg)"/>
  <circle cx="96" cy="104" r="58" fill="#f59e0b" opacity=".18"/>
  <circle cx="704" cy="484" r="86" fill="#ea580c" opacity=".12"/>
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="448" rx="248" ry="48" fill="#7c2d12" opacity=".18"/>
    <path d="M177 315h446l-35 142c-13 51-62 81-188 81s-175-30-188-81z" fill="url(#bowl)"/>
    <ellipse cx="400" cy="316" rx="224" ry="76" fill="#b91c1c"/>
    <ellipse cx="400" cy="302" rx="202" ry="64" fill="url(#sweet)" stroke="#fef3c7" stroke-width="8"/>
    <g fill="#b45309" opacity=".65">
      <circle cx="302" cy="290" r="9"/><circle cx="353" cy="321" r="7"/><circle cx="431" cy="280" r="8"/>
      <circle cx="492" cy="315" r="10"/><circle cx="542" cy="292" r="7"/><circle cx="392" cy="300" r="6"/>
    </g>
    <g fill="#fff7ed" opacity=".9">
      <ellipse cx="337" cy="274" rx="18" ry="8" transform="rotate(-28 337 274)"/>
      <ellipse cx="470" cy="274" rx="18" ry="8" transform="rotate(25 470 274)"/>
      <ellipse cx="430" cy="333" rx="16" ry="7" transform="rotate(-12 430 333)"/>
    </g>
  </g>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#9a3412">ASHWATH FRESH</text>
  <text x="400" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#7c2d12">Traditional Tadakanapally Palakova</text>
</svg>
